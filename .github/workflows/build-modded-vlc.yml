name: Build modded VLC

# 在 GitHub 免费云服务器上编译带「字幕修复补丁」的 VLC APK。
# 关键：直接用 VLC 官方的 Android CI 镜像(里面 SDK/NDK/gradle 全预装好)，
# 跑官方构建脚本 compile.sh -t(用预编译 libVLC，不编 ffmpeg，快且稳)。
# 结果在 Actions 运行页的 Artifacts 下载。
# 需要仓库根目录存在 vlc-subtitle-fix.patch 这个补丁文件。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow"
  push:
    branches: [patch-subtitle]

jobs:
  build:
    runs-on: ubuntu-22.04
    # VLC 官方 Android 构建镜像：SDK / NDK / 各类工具链已预装
    container:
      image: registry.videolan.org/vlc-debian-android:20260610055743
    steps:
      - name: Checkout (含 libvlc / medialibrary 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 环境检查 (确认镜像内的 SDK/NDK 已就位)
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "PATH 含 gradle? $(command -v gradle || echo 无系统gradle，compile.sh会自带)"

      - name: 应用字幕修复补丁
        run: git apply vlc-subtitle-fix.patch && echo "PATCH APPLIED OK"

      - name: 编译应用 (官方镜像 + 预编译 libVLC, 仅 arm64-v8a)
        run: ./buildsystem/compile.sh -a arm64-v8a -t

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-modded-apk
          path: application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: warn
