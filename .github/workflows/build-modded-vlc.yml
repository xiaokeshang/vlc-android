name: Build modded VLC

# 在 GitHub 免费云服务器上编译带「字幕修复补丁」的 VLC APK。
# 本机/平板无需安装任何开发工具。编译结果在 Actions 运行页的 Artifacts 下载。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow"
  push:
    branches: [patch-subtitle]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (含 libvlc / medialibrary 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 libVLC 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake ant autopoint cmake g++ libtool-bin m4 make meson ninja-build patch pkg-config ragel subversion unzip gettext build-essential python3 python3-pip openjdk-17-jdk curl git

      - name: 安装 Android SDK + NDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_SDK=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 写入并应用字幕修复补丁
        run: |
          echo '' | base64 -d > /tmp/subtitle-fix.patch
          git apply /tmp/subtitle-fix.patch && echo "PATCH APPLIED OK"

      - name: 编译 libVLC + medialibrary + 应用 (arm64-v8a)
        working-directory: buildsystem
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
        run: |
          ./compile.sh -a arm64-v8a -l -m

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-modded-apk
          path: application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: warn
