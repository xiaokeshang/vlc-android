name: Build modded VLC

# 在 GitHub 免费云服务器上编译带「字幕修复补丁」的 VLC APK。
# 用标准 ubuntu 镜像自己装 Android SDK/NDK，再跑官方构建脚本 compile.sh -t
# （用预编译 libVLC contribs，不编 ffmpeg，快且稳；默认 assembleDev，无需签名）。
# 结果在 Actions 运行页的 Artifacts 下载。
# 需要仓库根目录存在 vlc-subtitle-fix.patch 这个补丁文件。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow"
  push:
    branches: [patch-subtitle]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (含 libvlc / medialibrary 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK + NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip curl
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: 应用字幕修复补丁
        run: git apply vlc-subtitle-fix.patch && echo "PATCH APPLIED OK"

      - name: 配置 git 身份 (compile.sh 给源码打补丁需要)
        run: |
          git config --global user.email "build@localhost"
          git config --global user.name "VLC Build"

      - name: 编译应用 (官方 compile.sh, 预编译 libVLC, 仅 arm64-v8a)
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
        run: ./buildsystem/compile.sh -a arm64-v8a -t

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-modded-apk
          path: application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: warn
