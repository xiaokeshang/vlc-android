name: Build modded VLC

# 在 GitHub 免费云服务器上编译带「字幕修复补丁」的 VLC APK。
# 只编译改了的应用层(Kotlin 字幕补丁),libVLC 引擎拉官方预编译包,
# 编译快、不易超时/内存爆。结果在 Actions 运行页的 Artifacts 下载。
# 需要仓库根目录存在 vlc-subtitle-fix.patch 这个补丁文件。
on:
  workflow_dispatch:        # 允许在 Actions 页面手动点 "Run workflow"
  push:
    branches: [patch-subtitle]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (含 libvlc / medialibrary 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 应用字幕修复补丁
        run: git apply vlc-subtitle-fix.patch && echo "PATCH APPLIED OK"

      - name: 用官方预编译 libVLC 编译应用
        working-directory: application/vlc-android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: vlc-modded-apk
          path: application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: warn
